<!doctype html>
<html lang="zh-TW">
  <head>
    <meta charset="utf-8" />
    <title>Status Monitor</title>
    <style>
      :root {
        --surface-alpha: 1;
        --bg: var(--dsw-alias-bg-base, #16181c);
        --bg2: var(--dsw-alias-bg-layer-1, #1e2126);
        --fg: var(--dsw-alias-label-primary, #e6edf3);
        --fg2: var(--dsw-alias-label-secondary, #9aa4af);
        --fg3: var(--dsw-alias-label-tertiary, #6b7684);
        --line: var(--dsw-alias-border-l1, #2c313a);
        --green: #3fb950;
        --cmd: #7ee787;
        --amber: #d29922;
        --red: #f85149;
        --brand: #4f8cff;
        color-scheme: dark;
      }
      :root[data-theme="terminal"] {
        --bg: #05080a;
        --bg2: #0a1410;
        --fg: #d7f7d2;
        --fg2: #93b39a;
        --fg3: #5a7a66;
        --line: #1c3a26;
        --green: #6ee7a0;
        --cmd: #d9ffe4;
        --amber: #e3c46a;
        --red: #ff7b72;
        --brand: #22d3a7;
        color-scheme: dark;
      }
      :root[data-theme="light"] {
        --bg: #f6f7f9;
        --bg2: #ffffff;
        --fg: #1b1f24;
        --fg2: #4a545f;
        --fg3: #7a8794;
        --line: #d5dae0;
        --green: #1a7f37;
        --cmd: #116329;
        --amber: #9a6700;
        --red: #cf222e;
        --brand: #0969da;
        color-scheme: light;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: transparent;
        overflow: hidden;
        font: 12px/1.45 system-ui, -apple-system, "Segoe UI", "Microsoft JhengHei", sans-serif;
        color: var(--fg);
        user-select: none;
      }
      #app {
        position: absolute;
        inset: 0;
        display: flex;
        flex-direction: column;
        border-radius: 12px;
        overflow: hidden;
        clip-path: inset(0 round 12px);
        isolation: isolate;
        background: transparent;
        border: 1px solid color-mix(in srgb, var(--line) calc(var(--surface-alpha, 1) * 100%), transparent);
        box-shadow: 0 18px 60px rgba(0, 0, 0, 0.55);
      }
      #app::before {
        content: "";
        position: absolute;
        inset: 0;
        background: linear-gradient(180deg, var(--bg2), var(--bg));
        opacity: var(--surface-alpha, 1);
        pointer-events: none;
      }
      #bar {
        position: relative;
        z-index: 1;
        flex: none;
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 6px 8px 6px 12px;
        background: rgba(255, 255, 255, 0.035);
        border-bottom: 1px solid var(--line);
        user-select: none;
        cursor: default;
      }
      #bar:active {
        cursor: default;
      }
      #title {
        font-size: 11px;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        color: var(--fg2);
      }
      #ver {
        font-size: 10px;
        letter-spacing: 0.04em;
        color: var(--fg3);
        font-variant-numeric: tabular-nums;
      }
      #sess {
        font-size: 10px;
        letter-spacing: 0.04em;
        color: var(--fg3);
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        padding: 1px 6px;
        border-radius: 999px;
        background: color-mix(in srgb, var(--fg) 8%, transparent);
        max-width: 150px;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      #sess:empty {
        display: none;
      }
      #state {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        font-size: 11px;
        color: var(--fg2);
      }
      #dot {
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: var(--fg3);
        box-shadow: 0 0 0 0 rgba(63, 185, 80, 0.5);
      }
      #dot[data-busy="true"] {
        background: var(--green);
        animation: pulse 1.6s ease-out infinite;
      }
      @keyframes pulse {
        0% {
          box-shadow: 0 0 0 0 rgba(63, 185, 80, 0.45);
        }
        70% {
          box-shadow: 0 0 0 7px rgba(63, 185, 80, 0);
        }
        100% {
          box-shadow: 0 0 0 0 rgba(63, 185, 80, 0);
        }
      }
      #ctl {
        margin-left: auto;
        display: flex;
        align-items: center;
        gap: 2px;
        -webkit-app-region: no-drag;
      }
      #bar {
        -webkit-app-region: drag;
      }
      #app[data-maxed="true"] #bar {
        -webkit-app-region: no-drag;
      }
      #alphabox {
        display: flex;
        align-items: center;
        gap: 5px;
        padding: 0 4px 0 2px;
      }
      #alpha {
        width: 76px;
        height: 3px;
        accent-color: var(--brand);
        cursor: pointer;
      }
      #alphaval {
        font-size: 10px;
        color: var(--fg2);
        min-width: 32px;
        text-align: right;
        font-variant-numeric: tabular-nums;
      }
      #ctl button {
        appearance: none;
        border: 0;
        background: transparent;
        color: var(--fg2);
        font: inherit;
        font-size: 11px;
        line-height: 1;
        padding: 5px 8px;
        border-radius: 6px;
        min-width: 28px;
        cursor: pointer;
      }
      #ctl button:hover {
        background: color-mix(in srgb, var(--fg) 12%, transparent);
        color: var(--fg);
      }
      #ctl button[data-pin="on"] {
        color: var(--brand);
        background: color-mix(in srgb, var(--brand) 22%, transparent);
      }
      #ctl button[data-pin="on"] svg {
        fill: currentColor;
      }
      #ctl button[data-close="true"]:hover {
        background: var(--red);
        color: #fff;
      }
            #app[data-maxed="true"] #body {
        flex: 1 1 0;
        min-height: 0;
      }
      #app[data-maxed="true"] #stream {
        flex: 1 1 0;
        height: auto;
        min-height: 0;
      }
#body {
        position: relative;
        z-index: 1;
        flex: 1 1 auto;
        min-height: 0;
        overflow: hidden;
        padding: 10px 12px 8px;
        display: flex;
        flex-direction: column;
        gap: 9px;
      }
      #body::-webkit-scrollbar {
        width: 6px;
      }
      #body::-webkit-scrollbar-thumb {
        background: var(--line);
        border-radius: 3px;
      }
      .sec {
        display: flex;
        flex-direction: column;
        gap: 5px;
        min-height: 0;
      }
      .sec.grow {
        flex: 1 1 0;
        min-height: 0;
      }
      .seclabel {
        font-size: 10px;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        color: var(--fg3);
      }
      .work {
        display: flex;
        align-items: baseline;
        gap: 6px;
        min-width: 0;
      }
      .tool {
        flex: none;
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        font-size: 11.5px;
        color: var(--brand);
      }
      .detail {
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        font-size: 11px;
        color: var(--fg2);
      }
      .think {
        height: 92px;
        flex: none;
        overflow-y: auto;
        white-space: pre-wrap;
        word-break: break-word;
        font-size: 11.5px;
        color: var(--fg2);
        background: color-mix(in srgb, var(--bg2) 70%, transparent);
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 7px 9px;
      }
      .think::-webkit-scrollbar {
        width: 6px;
      }
      .think::-webkit-scrollbar-thumb {
        background: var(--line);
        border-radius: 3px;
      }
      #stream {
        flex: 1 1 0;
        height: auto;
        min-height: 0;
        overflow-y: auto;
        overflow-x: hidden;
        padding: 7px 9px;
        border-radius: 8px;
        background: color-mix(in srgb, var(--bg) 82%, transparent);
        border: 1px solid var(--line);
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        font-size: clamp(13px, 0.9vw, 18px);
        line-height: 1.5;
        color: var(--green);
        white-space: pre-wrap;
        overflow-wrap: anywhere;
      }
      #stream::-webkit-scrollbar {
        width: 6px;
      }
      #stream::-webkit-scrollbar-thumb {
        background: var(--line);
        border-radius: 3px;
      }
      .line {
        animation: in 0.16s ease-out both;
      }
      .line[data-kind="seed"] {
        opacity: 0.34;
      }
      .line[data-kind="cmd"] {
        color: var(--cmd);
        font-weight: 600;
      }
      .line[data-kind="out"] {
        color: var(--fg2);
      }
      .line[data-kind="ok"] {
        color: var(--green);
      }
      .line[data-kind="error"] {
        color: var(--red, #ff6b6b);
        font-weight: 600;
      }
      .line[data-kind="dim"] {
        color: var(--fg3);
      }
      .line[data-kind="gap"] {
        height: 6px;
      }
      .line[data-kind="note"] {
        opacity: 0.6;
        color: var(--fg2);
      }
      .line[data-kind="file"] {
        color: var(--amber);
      }
      @keyframes in {
        from {
          opacity: 0;
          transform: translateY(3px);
        }
        to {
          opacity: 1;
          transform: none;
        }
      }
      .cursor {
        display: inline-block;
        width: 6px;
        height: 10px;
        margin-left: 2px;
        vertical-align: -1px;
        background: currentColor;
        animation: blink 1s steps(1, end) infinite;
      }
      @keyframes blink {
        0%,
        49% {
          opacity: 1;
        }
        50%,
        100% {
          opacity: 0;
        }
      }
      .hwline {
        display: flex;
        flex-direction: column;
        gap: 8px;
        min-width: 0;
      }
      .hwgrid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(114px, 1fr));
        gap: 8px;
        min-width: 0;
      }
      .card {
        display: flex;
        flex-direction: column;
        gap: 3px;
        min-width: 0;
        padding: 6px 7px 7px;
        border-radius: 8px;
        border: 1px solid color-mix(in srgb, var(--line) 72%, transparent);
        background: color-mix(in srgb, var(--fg) 4%, transparent);
      }
      .ctitle {
        font-size: 10px;
        letter-spacing: 0.07em;
        text-transform: uppercase;
        color: var(--fg3);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .cgraph {
        display: flex;
        align-items: flex-end;
        gap: 1px;
        height: 26px;
        border-radius: 4px;
        overflow: hidden;
        background: color-mix(in srgb, var(--fg) 6%, transparent);
      }
      .cgraph i {
        flex: 1;
        min-width: 1px;
        border-radius: 1px 1px 0 0;
        background: var(--green);
        opacity: 0.78;
      }
      .card[data-tone="warn"] .cgraph i {
        background: var(--amber);
      }
      .card[data-tone="error"] .cgraph i {
        background: var(--red);
      }
      .card[data-tone="brand"] .cgraph i {
        background: var(--brand);
      }
        .cbig {
          font-size: 19px;
          font-weight: 600;
          line-height: 1.15;
          letter-spacing: -0.01em;
          color: var(--fg);
          font-variant-numeric: tabular-nums;
        }
      .cmodel {
        font-size: 10px;
        color: var(--fg2);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .cvalue {
        font-size: 11px;
        color: var(--fg);
        font-variant-numeric: tabular-nums;
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .elapsed {
      .elapsed {
        margin-left: auto;
        color: var(--fg3);
        font-size: 11px;
        font-variant-numeric: tabular-nums;
        white-space: nowrap;
      }
      .facts {
        display: flex;
        flex-wrap: wrap;
        gap: 4px 10px;
        font-size: 10px;
        color: var(--fg3);
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      }
    </style>
  </head>
  <body>
    <div id="app">
      <div id="bar">
        <span id="title">Live monitor</span>
        <span id="ver">v—</span>
        <span id="state"><i id="dot" data-busy="false"></i><span id="statelabel">idle</span></span>
        <div id="ctl">
          
          <button id="btn-reload" type="button" title="重新整理（切換對話後按一下）">⟳</button>
          <button id="btn-pin" type="button" title="釘選（穿透 + 不可拖動）" data-pin="off"><svg viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"><path d="M9 3h6l-1 6 3 3v2H7v-2l3-3-1-6z"/><path d="M12 14v7"/></svg></button>
          <button id="btn-max" type="button" title="Maximize">⛶</button>
          <button id="btn-close" type="button" data-close="true" title="Close">✕</button>
        </div>
      </div>
      <div id="body">
        <div class="sec" id="sec-work">
          <span class="seclabel">目前工作</span>
          <div class="work"><span class="tool" id="tool">—</span><span class="detail" id="detail"></span><span class="elapsed" id="elapsed"></span></div>
        </div>
        <div class="sec" id="sec-think">
          <span class="seclabel">思考</span>
          <div class="think" id="think">（這一輪還沒有思考內容）</div>
        </div>

        <div class="sec grow" id="sec-code">
          <span class="seclabel">程式碼流</span>
          <div id="stream"><span class="cursor"></span></div>
        </div>
        <div class="sec" id="sec-hw">
          <span class="seclabel">硬體</span>
          <div class="hwline">
            <div class="hwgrid" id="hwgrid">
              <div class="card" id="c-cpu"><span class="ctitle">CPU</span><div class="cgraph" id="g-cpu"></div><span class="cmodel" id="n-cpu">—</span><span class="cvalue" id="x-cpu">—</span></div>
              <div class="card" data-tone="brand" id="c-mem"><span class="ctitle">記憶體</span><div class="cgraph" id="g-mem"></div><span class="cmodel" id="n-mem">—</span><span class="cvalue" id="x-mem">—</span></div>
              <div id="gpuroom" style="display: contents"></div>
              <div class="card" data-tone="warn" id="c-disk"><span class="ctitle">磁碟</span><div class="cgraph" id="g-disk"></div><span class="cmodel" id="n-disk">—</span><span class="cvalue" id="x-disk">—</span></div>
              <div class="card" data-tone="ok" id="c-balance"><span class="ctitle">餘額</span><span class="cbig" id="v-balance">—</span><span class="cmodel" id="n-spend">本會話 —</span><span class="cvalue" id="x-tokens">— tok</span></div>
            </div>
            <div class="facts" id="hwfacts"></div>
            <div class="facts" id="facts"></div>
          </div>

        </div>
      </div>        </div>
      </div>
    </div>
    <script>
      const LABELS = {
        idle: '閒置中',
        thinking: '思考中',
        writing: '編寫中',
        editing: '修改中',
        tooling: '執行工具中',
        working: '處理中',
        waiting: '等你回應',
      };
      const BLOCKS = [
        [
          { t: '$ git status --short --branch', k: 'cmd' },
          { t: '## main...origin/main [ahead 3]  example.com/plugins/dsh-status-badge', k: 'dim' },
          { t: ' M lib/index.js            bridge proxy routes, gpu sampler, live state store, metrics snapshot', k: 'out' },
          { t: ' M lib/client.js           always-on pusher, 250ms cadence, window mode, token refresh', k: 'out' },
          { t: '?? test/render.test.mjs     9 status fixtures, feed lines, stream cadence assertions', k: 'out' },
          { t: '?? window.html              frameless monitor surface, three panes, title bar controls', k: 'out' },
        ],
        [
          { t: '$ node --check lib/index.js && node --check lib/client.js && node --check lib/window.html', k: 'cmd' },
          { t: '  ok  lib/index.js       14.2ms   0 errors   0 warnings   syntax esm, target node 24.21', k: 'ok' },
          { t: '  ok  lib/client.js      11.8ms   0 errors   0 warnings   syntax esm, target chrome 138', k: 'ok' },
          { t: '  ok  window.html         4.1ms   0 errors   0 warnings   inline script block, strict mode', k: 'ok' },
          { t: '  done  3 files checked, 0 problems, 0 fixes applied, 30.1ms total', k: 'dim' },
        ],
        [
          { t: '$ pnpm test --filter @local/status-badge --reporter=verbose --coverage=false', k: 'cmd' },
          { t: '  PASS  test/render.test.mjs (1.24s)   node v24.21.0   esm loader   worker 1/1', k: 'ok' },
          { t: '    ok  9 status fixtures - idle, thinking, writing, editing, tooling, working, waiting', k: 'ok' },
          { t: '    ok  feed lines - thinking 1400 chars, answer 800 chars, tool preview 40 rows', k: 'ok' },
          { t: '    ok  stream cadence - tick 12ms, step len/4, hold 0, idle threshold 4, limit 200 rows', k: 'ok' },
          { t: '    ok  window routes - open, move, restore, maximize, opacity, state, diag round trip', k: 'ok' },
          { t: '  Tests  12 passed (12)     Time  1.24s     Snapshots  0     Coverage  91.4% statements', k: 'dim' },
        ],
        [
          { t: '$ curl -s http://127.0.0.1:8080/status-badge/metrics | jq \'{cpu: .cpuPct, gpu: .gpu.list, mem: .memUsed}\'', k: 'cmd' },
          { t: '  { "cpu": 23.4, "gpu": [ { "pct": 50, "name": "RTX 5080", "memUsed": 8090812416 } ], "mem": 11176345600 }', k: 'out' },
          { t: '  http 200   content-type application/json   cache-control no-store   14.8ms round trip', k: 'dim' },
        ],
        [
          { t: '$ git diff --stat lib/index.js lib/client.js window.html test/render.test.mjs', k: 'cmd' },
          { t: ' lib/index.js            | 42 +++++++++++++++++++++++-------------------  18 insertions', k: 'out' },
          { t: ' lib/client.js           | 18 +++++++++++++------                         12 insertions', k: 'out' },
          { t: ' window.html             | 96 ++++++++++++++++++++++++++++++++++++++++-----  61 insertions', k: 'out' },
          { t: ' test/render.test.mjs    |  8 +++++---                                     5 insertions', k: 'out' },
          { t: ' 4 files changed, 121 insertions(+), 35 deletions(-)   working tree otherwise clean', k: 'dim' },
        ],
        [
          { t: '$ rg -n "setWindowOpenHandler|__startStatusBridge|setOpacity|skipTaskbar" lib/main.js', k: 'cmd' },
          { t: ' 6863: view.webContents.setWindowOpenHandler(({ url, frameName }) => { return { action: "deny" }; });', k: 'out' },
          { t: ' 7012: async function __startStatusBridge() { const srv = http.createServer(async (req, res) => {', k: 'out' },
          { t: ' 7031: skipTaskbar: true, frame: false, transparent: true, backgroundColor: "#00000000", width: 720,', k: 'out' },
          { t: ' 7104: if (u.pathname === "/opacity") { __statusWin.setOpacity(clamp(v)); return reply({ ok: true }); }', k: 'out' },
        ],
        [
          { t: '  stream ready  ·  rows 200  ·  tick 12ms  ·  limit 200  ·  font clamp(13px, 0.9vw, 18px)  ·  wrap anywhere', k: 'ok' },
        ],
      ];

      const LIMITS = { simple: 200, normal: 200, full: 200 };
      let LIMIT = 200;
      let PACE = 'smooth';
      const THEME_PARAM = new URLSearchParams(location.search).get('theme');
      if (THEME_PARAM === 'dark' || THEME_PARAM === 'terminal' || THEME_PARAM === 'light') {
        document.documentElement.dataset.theme = THEME_PARAM;
      }

      const HOST_BASE = (new URLSearchParams(location.search).get("origin") || "").replace(/\/$/, "");
      const streamBox = document.getElementById('stream');
      const think = document.getElementById('think');
      const toolEl = document.getElementById('tool');
      const elapsedEl = document.getElementById('elapsed');
      const detailEl = document.getElementById('detail');
      const dotEl = document.getElementById('dot');
      const stateEl = document.getElementById('statelabel');
      const factsEl = document.getElementById('facts');
      const alphaEl = document.getElementById('alpha');
      const alphaVal = document.getElementById('alphaval');
      const btnReload = document.getElementById('btn-reload');
      const btnPin = document.getElementById('btn-pin');
      const btnMax = document.getElementById('btn-max');
      const btnClose = document.getElementById('btn-close');
      const cursor = streamBox.querySelector('.cursor');

      const rec = { rows: [], pending: [], seen: new Set(), target: '', typed: '', kind: '', hold: 0, idle: 0, seq: 0, nodes: [] };
      let lastAlpha = 1;
      let liveRunning = false;

      function ingest(lines) {
        if (!Array.isArray(lines)) return;
        const fresh = [];
        for (const entry of lines) {
          const object = entry !== null && typeof entry === 'object';
          const value = object ? String(entry.text || '') : String(entry || '');
          if (value.trim() === '' || rec.seen.has(value)) continue;
          rec.seen.add(value);
          fresh.push({ text: value, kind: object && entry.kind ? String(entry.kind) : 'real' });
        }
        if (fresh.length > 40) {
          for (const item of fresh) pushRow(item.text, item.kind);
          paint();
          trimSeen();
          return;
        }
        if (PACE === 'instant' || flushOnce) {
          flushOnce = false;
          for (const item of fresh) pushRow(item.text, item.kind);
          if (fresh.length > 0) paint();
          trimSeen();
          return;
        }
        for (const item of fresh) rec.pending.push(item);
        if (rec.pending.length > 120) rec.pending = rec.pending.slice(-120);
        trimSeen();
      }

      function trimSeen() {
        while (rec.seen.size > 3000) {
          const oldest = rec.seen.values().next().value;
          if (oldest === void 0) break;
          rec.seen.delete(oldest);
        }
      }

      let flushOnce = false;
      let lastFlow = '';

      function applyFlow(flow, pace) {
        const mode = flow === 'simple' || flow === 'normal' ? flow : 'full';
        const nextLimit = LIMITS[mode] || 200;
        const changed = mode !== lastFlow;
        lastFlow = mode;
        LIMIT = nextLimit;
        if (changed) {
          // A mode switch rewrites the whole pane from the next payload instead of
          // keeping rows the new mode would never have produced.
          flushOnce = true;
          rec.rows.length = 0;
          rec.pending.length = 0;
          rec.target = '';
          rec.typed = '';
          rec.kind = '';
          rec.seen.clear();

          const response = await fetch(HOST_BASE + '/status-badge/window/action', {
            method: 'POST',
            headers: { 'content-type': 'application/json' },
            body: JSON.stringify({ action }),
          });          const data = await response.json();
          if (data && data.ok) {
            if (action === 'maximize') {
              applyMaxed(data.maxed === true);
              btnMax.textContent = data.maxed ? '❐' : '⛶';
              btnMax.title = data.maxed ? 'Restore' : 'Maximize';
            }
            if (action === 'close') window.close();
            return data;
          }
          return localAct(action);
        } catch (error) {
          return localAct(action);
        }
      }

      const barEl = document.getElementById('bar');
      let dragState = null;

      async function readWindowState() {
        try {
          const response = await fetch(HOST_BASE + '/status-badge/window/state');
          const data = await response.json();
          if (data !== null && typeof data === 'object') {
            lockOn = data.pinned === true && data.passthrough === true;
        paintPin(lockOn);
          }
          return data !== null && typeof data === 'object' ? data : null;
        } catch {
          return null;
        }
      }

      function paintSession(tag) {
        const el = document.getElementById('sess');
        if (el === null) return;
        el.textContent = '';
      }

      async function postWindow(path, body) {
        try {
          const response = await fetch(HOST_BASE + path, {
            method: 'POST',
            headers: { 'content-type': 'application/json' },
            body: JSON.stringify(body || {}),
          });
          return await response.json();
        } catch {
          return null;
        }
      }

      barEl.addEventListener('mousedown', async (event) => {
        if (event.button !== 0) return;
        if (event.target.closest('#ctl')) return;
        event.preventDefault();
        const startX = event.screenX;
        const startY = event.screenY;
        const started = await postWindow('/status-badge/window/dragstart', { x: startX, y: startY });
        if (started === null || started.ok !== true) return;
        const bounds = started.bounds && typeof started.bounds === 'object' ? started.bounds : null;
        dragState = {
          startX: startX,
          startY: startY,
          baseX: bounds ? bounds.x : 320,
          baseY: bounds ? bounds.y : 240,
          last: 0,
        };
      });

      window.addEventListener('mousemove', (event) => {
        if (dragState === null) return;
        const dx = event.screenX - dragState.startX;
        const dy = event.screenY - dragState.startY;
        const now = Date.now();
        if (now - dragState.last < 33) return;
        dragState.last = now;
        postWindow('/status-badge/window/move', { x: dragState.baseX + dx, y: dragState.baseY + dy });
      });

      window.addEventListener('mouseup', () => {
        if (dragState !== null) {
          dragState = null;
          fetch(HOST_BASE + '/status-badge/window/ctl?path=snap').catch(() => {});
        }
      });
      window.addEventListener('blur', () => {
        dragState = null;
      });

      setAlpha(100);
      let hoveringBar = false;
      let lockOn = false;
      window.addEventListener('mousemove', (event) => {
        const inBar = event.clientY <= 42;
        if (inBar === hoveringBar) return;
        hoveringBar = inBar;
        if (lockOn !== true) return;
        void postWindow('/status-badge/window/ctl?path=passthrough&value=' + (inBar ? '0' : '1'), null);
      });

      if (btnReload !== null) btnReload.addEventListener('click', () => window.location.reload());
      if (btnPin !== null) btnPin.addEventListener('click', () => void togglePin());
      btnMax.addEventListener('click', () => act('maximize'));
      btnClose.addEventListener('click', () => act('close'));
      window.addEventListener('keydown', (event) => {
        if (event.key === 'Escape') act('close');
      });

      setTimeout(fillToViewport, 80);
      window.addEventListener('resize', () => {
        setTimeout(fillToViewport, 60);
      });
      setInterval(tick, 12);
      pullLive();
      pullMetrics();
      setInterval(pullLive, 120);
      setInterval(pullMetrics, 2400);
    </script>
  </body>
</html>
